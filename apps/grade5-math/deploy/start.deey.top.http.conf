# Owned by os-taxonomy/apps/grade5-math; leaves default and existing sites alone.
limit_req_zone $binary_remote_addr zone=grade5_math_api:1m rate=5r/s;
server {
    listen 80;
    listen [::]:80;
    server_name start.deey.top;
    root /var/www/grade5-math-current;
    access_log /var/log/nginx/grade5-math.access.log main;
    error_log /var/log/nginx/grade5-math.error.log;
    client_max_body_size 16k;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/grade5-math-acme;
        try_files $uri =404;
    }
    location /api/ {
        limit_req zone=grade5_math_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 20s;
    }
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control no-store;
    }
}
